<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DK 台灣島｜全台門市地圖</title>
  <meta name="description" content="DK 高博士全台門市，拼成一座會呼吸的台灣島。每間店都有自己的玩法、店長的一句話與店長推薦。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%238B2332'/%3E%3Ctext x='32' y='42' font-family='Georgia,serif' font-size='28' font-weight='700' fill='white' text-anchor='middle'%3EDK%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,600&family=Noto+Sans+TC:wght@400;500;700;900&family=LXGW+WenKai+TC:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=202610281637">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
        "./js/buildings.js": "./js/buildings.js?v=202610281637",
        "./js/islands.js": "./js/islands.js?v=202610281637",
        "./js/landmarks.js": "./js/landmarks.js?v=202610281637",
        "./js/main.js": "./js/main.js?v=202610281637",
        "./js/people.js": "./js/people.js?v=202610281637",
        "./js/residents.js": "./js/residents.js?v=202610281637",
        "./js/service.js": "./js/service.js?v=202610281637",
        "./js/stamps.js": "./js/stamps.js?v=202610281637",
        "./js/textrules.js": "./js/textrules.js?v=202610281637",
        "./js/town.js": "./js/town.js?v=202610281637",
        "./js/ui.js": "./js/ui.js?v=202610281637",
        "./js/util.js": "./js/util.js?v=202610281637",
        "./js/world.js": "./js/world.js?v=202610281637"
      }
    }
  </script>
</head>
<body>
  <div class="app">
    <main id="stage" class="stage">
      <header class="brand">
        <p id="brand-eyebrow" class="brand-eyebrow"></p>
        <h1 id="brand-title">DK 台灣島</h1>
        <p id="brand-sub" class="brand-sub"></p>
      </header>

      <nav class="toolbar" aria-label="工具列">
        <button id="btn-overview" type="button">全景</button>
        <button id="btn-service" type="button" class="btn-service">客服<span class="hide-mobile">任務</span></button>
        <button id="btn-list" type="button" class="only-mobile">清單</button>
        <button id="btn-help" type="button" aria-label="導覽">?</button>
      </nav>

      <section id="card" class="card" hidden aria-live="polite"></section>

      <div id="loading" class="loading">
        <span class="spinner" aria-hidden="true"></span>
        <p>島正在浮出海面…</p>
      </div>
      <p id="warn-badge" class="warn-badge" hidden></p>
      <div class="fabs">
        <button id="btn-shoppers" type="button" class="fab-shoppers" hidden>幫路人挑鞋</button>
        <button id="btn-stamps" type="button" class="fab-stamps" hidden>集章</button>
        <button id="btn-me" type="button" class="fab-me" hidden>＋ 成為島民</button>
      </div>
    </main>

    <aside id="index" class="index" aria-label="門市清單">
      <div class="index-head">
        <p class="eyebrow">THE STORE INDEX</p>
        <h2 id="index-title"></h2>
        <p id="index-stats" class="muted"></p>
        <button id="index-close" type="button" class="index-close only-mobile" aria-label="收起清單">×</button>
      </div>
      <input id="search" class="search" type="search" placeholder="搜尋門市、地址或玩法…" autocomplete="off">
      <div id="chips" class="chips"></div>
      <ol id="region-list" class="region-list"></ol>
    </aside>
  </div>

  <div id="intro" class="intro" hidden></div>

  <div id="shop" class="shop" hidden>
    <div class="door left" aria-hidden="true"><b>DK</b></div>
    <div class="door right" aria-hidden="true"><small>DR.KAO</small></div>
    <div id="shop-inner" class="shop-inner" role="dialog" aria-modal="true" aria-labelledby="shop-name" tabindex="-1"></div>
  </div>

  <div id="modal" class="modal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <header>
        <b id="modal-title"></b>
        <a id="modal-open" target="_blank" rel="noopener">另開視窗 ↗</a>
        <button id="modal-close" type="button" aria-label="關閉">×</button>
      </header>
      <iframe id="modal-frame" title="門市小遊戲" allow="autoplay; fullscreen; clipboard-write"></iframe>
    </div>
  </div>

  <script type="module" src="js/main.js?v=202610281637"></script>
</body>
</html>
